<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #07050b;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    padding: 30px 0;
    background-image:
      radial-gradient(800px 600px at 20% 20%, rgba(232, 196, 196, 0.06), transparent 60%),
      radial-gradient(900px 700px at 80% 90%, rgba(240, 229, 219, 0.04), transparent 60%);
    -webkit-tap-highlight-color: transparent;
  }
  #root { display: flex; align-items: center; justify-content: center; }

  /* On a real phone the prototype's iPhone bezel + dark stage would
     be visible inside the actual iPhone. Drop them and let the cream
     app fill the entire viewport. */
  @media (max-width: 480px) {
    body {
      background: #f3eadb;
      background-image: none;
      padding: 0;
      min-height: 100dvh;
      display: block;
    }
    #root { display: block; min-height: 100dvh; }
  }
</style>
</head>
<body>

<div id="root"></div>

<!-- React (production) + Babel standalone for in-browser JSX -->
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<script type="text/babel" src="store.jsx"></script>
<script type="text/babel" src="ui.jsx"></script>
